name: Android APK & AAB Build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Generate Android App Icons
        run: |
          npm install --no-save @capacitor/assets sharp
          mkdir -p assets
          cp public/icons/icon.svg assets/icon.svg
          npx @capacitor/assets generate --android
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0b0f19</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
      - name: Build Android APK and Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tuitrix-upload.jks"
            cd android && ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/tuitrix-upload.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk tuitrix-latest.apk
          else
            cd android && ./gradlew assembleDebug bundleRelease
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk tuitrix-latest.apk
          fi
      - name: Clean up Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tuitrix-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Tuitrix-Android
          path: |
            tuitrix-latest.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: "Tuitrix Android Release"
          files: |
            tuitrix-latest.apk
            android/app/build/outputs/bundle/release/app-release.aab
          make_latest: true
